<section id="tab-digests" class="tab-pane">
    <div class="feed-layout">
        <!-- Digests Sidebar -->
        <aside class="filter-sidebar">
            <div class="filter-header">
                <h3><i class="fa-solid fa-envelope-open-text text-purple"></i> Daily Digests</h3>
            </div>
            <div id="digests-list-container" class="digests-list">
                <!-- Digest items injected dynamically -->
                <div class="no-digests-text">No digests found yet. Run the scraper sync to generate a digest of matches!</div>
            </div>
        </aside>

        <!-- Digest Display Area -->
        <div class="feed-main">
            <div class="glass-card digest-view-card" id="digest-view-card">
                <div class="digest-view-header" id="digest-view-header">
                    <h2 id="digest-title">Select a digest to begin</h2>
                    <span id="digest-meta"></span>
                 </div>
                <div class="divider"></div>
                <div class="digest-view-body" id="digest-view-body">
                    <div class="no-digest-selected">
                        <i class="fa-solid fa-envelope"></i>
                        <h3>No Digest Selected</h3>
                        <p>Select a matching digest from the sidebar list to view the compiled jobs report.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
