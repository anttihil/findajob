# Job Search Automation Configuration ("CareerRadar")

# The profile corpus is configured under `profile.corpus` near the bottom of this file.
# Personal documents are gitignored; scripts/sync_corpus.sh pulls achievements.md in from
# the separate `resume` repo.


# ---------------------------------------------------------------------------------------
# Scraping
#
# The cell matrix is ~252 cells (126 per source), rotated across runs rather than swept --
# see careerradar/search/scheduler.py. That rotation assumed LinkedIn rate-limits around the
# 10th page on a single IP, but that figure was never actually verified: a direct probe
# (scripts/probe_linkedin_page_wall.py, 2026-08-14) found zero 429s or blocks across 99
# consecutive pages on one proxied IP, stopping only at the guest API's own ~1000-result
# pagination ceiling. See experiments/linkedin_page_wall/. At these budgets a full matrix
# cycle takes roughly 5 days, which is what makes the 30-day minimum analysis window
# meaningful.
# ---------------------------------------------------------------------------------------
scraper:
  sources:
    indeed: true
    linkedin: true

  # Requests a cell spends, as two numbers the scheduler multiplies out
  # (search/scheduler.py: estimate_pages, estimate_units). Both are measured, not read off
  # the library: `careerradar search cost` compares them against what a run actually spent.
  page_size:
    indeed: 100       # results per GraphQL page. Was 15 until 2026-08-15, which charged an
                       # Indeed cell 5 pages for what measurement showed costs 1-2 requests
                       # (45 results arrived in one page; JobSpy asks for 100 per page)
    linkedin: 10      # results per guest-API page -- measured 2026-08-14 (see
                       # experiments/linkedin_page_wall/); JobSpy's own jobs_per_page=25
                       # constant does not match what the API actually returns per request

  # Extra requests per posting to obtain its description. This is the number that made the
  # LinkedIn budget wrong by 11x while it went uncounted: a 50-posting census cell spends
  # 6 search pages and 50 description fetches, not 5 requests.
  requests_per_description:
    indeed: 0         # descriptions arrive inside the search page, so a census is free
    linkedin: 1       # one request per posting (jobspy/linkedin/__init__.py
                       # _get_job_details); rewritten to the cheaper guest fragment in
                       # search/sources/jobspy_source.py, which changes the latency, not
                       # the count

  # How long raw scrape payloads are kept in raw_payloads/ so a normalizer bug can be
  # replayed without re-scraping. Pruned at the start of every non-dry run. At ~0.6MB per
  # cell and two runs a day, this bounds the archive at roughly 300-400MB. Set to 0 to
  # keep everything (it grows a few GB a year).
  archive_retention_days: 14

  # How often a cell in each tier should be revisited.
  cadence_hours:
    core: 24
    adjacent: 72
    breadth: 168

  # Lower bound on hours_old per tier. The effective value is derived per cell from the
  # actual revisit gap (>= 1.5x), so a missed run self-heals rather than leaving a hole.
  #
  # Lowered 2026-08-15 (was 72/168/336) to convert lookback DEPTH into FRESHNESS. A cell
  # asks for results_wanted postings out of everything in its hours_old window, and boards
  # rank that window by their own relevance, not by date. So a 72h window means a posting
  # published an hour ago competes with three days of backlog for the same 50-75 slots --
  # and it loses often: 45% of core observations and 86% of breadth ones came back
  # saturated, meaning the cell was truncated and whatever fell below the cut was never
  # seen. Median lag from date_posted to date_found is 2.0 days, and only 3.3% of the
  # corpus was found within a day of being posted.
  #
  # Narrowing the window makes each scrape a sweep of what is actually new. It is safe at
  # any run frequency because adaptive_hours_old() takes max(floor, 1.5 * actual gap): the
  # floor binds only while runs are ON TIME, and a sparse or missed run widens the window
  # back out on its own. So this does nothing until run frequency rises, then it starts
  # paying immediately -- there is no ordering dependency between the two changes.
  hours_old_floor:
    core: 24
    adjacent: 72
    breadth: 168
  max_hours_old: 336
  backfill_hours_old: 336

  # Hard guarantee: core cells in weight-1.0 locations are visited within this many hours,
  # or their families' supply figures are suppressed with a coverage warning.
  max_staleness_hours: 72

  # Per-tier scheduling deadline = cadence_hours * this. Any cell past its deadline is
  # scheduled ahead of the priority ranking. Coverage is an explicit guarantee rather than
  # something emerging from the product of six weighting factors -- an earlier design relied
  # on priority alone and starved every breadth cell indefinitely.
  # With 4: core within 4 days, adjacent within 12, breadth within 28.
  starvation_multiple: 4

  budgets:
    # Indeed is the volume workhorse: descriptions arrive in-response, so a census of
    # descriptions is free and its cells carry the skill analytics.
    indeed:
      # Measured 2026-08-15: a cell costs 1-2 requests, not the 5 the old page_size=15
      # implied. searches_per_run is therefore the only cap that binds here, which is the
      # intent -- request_units is set to cover a backfill run (results_wanted=200 -> 3
      # requests a cell) rather than to constrain a normal one.
      searches_per_run: 20
      request_units: 60
      results_wanted_default: 75
      max_results_wanted: 200
      min_seconds_between_searches: 2.0
      jitter_seconds: [0.5, 2.5]
      fetch_descriptions: true
      desc_selection: census

    # LinkedIn without proxies: titles only. Each description costs an extra request, and
    # on a single IP that was assumed to spend the entire ~10-page budget on a handful of
    # postings -- a probe (see below) found that assumption doesn't hold, and a separate
    # live run on one unproxied IP (2026-08-14) sustained ~1000 posts with no block or
    # 429. Descriptions are still off here since a real IP-flag risk hasn't been ruled out
    # for sustained description-fetching traffic specifically, only for plain search
    # pagination -- that's what the numbers below spend the new headroom on, raised from
    # searches_per_run=6/max_pages_per_run=14/max_results_wanted=75, still well under the
    # with_proxies tier below and far under the ~1000-post figure. Treat as a starting
    # point to tune further, not a settled ceiling. So these cells are desc_selection='none'
    # -- they count fully toward role supply (title, company, and location are complete)
    # but contribute nothing to skill demand.
    # Set SCRAPER_PROXIES and the scraper.proxies.with_proxies override flips this to a
    # full description census. See careerradar/search/proxies.py.
    linkedin:
      # max_pages_per_run is what binds. At page_size=10 and results_wanted_default=60 a
      # cell costs 7 requests -- 6 pages plus the one that finds the end (estimate_pages)
      # -- so 60 pages is ~8 cells a run, not the ~10 this comment claimed before the cost
      # model was corrected on 2026-08-15. The cap itself is deliberately NOT raised to
      # make searches_per_run reachable: 60 pages is a traffic limit chosen for a single
      # unproxied IP, and only the arithmetic describing it was wrong.
      #
      # request_units equals max_pages_per_run here because descriptions are off, so every
      # request this tier makes is a search page. Two caps, one number, on purpose.
      #
      # fetch_descriptions stays false here. The probe cleared plain search pagination on
      # one IP, not sustained per-posting description fetching, and that is the untested
      # traffic shape -- so the description census stays behind the proxy pool.
      searches_per_run: 15
      request_units: 60
      results_wanted_default: 60
      max_results_wanted: 100
      max_pages_per_run: 60
      # NOTE: read by nothing. Description fetching is all-or-nothing per cell via
      # fetch_descriptions/desc_selection (scheduler._make_task), so this caps nothing.
      # Left in place rather than deleted because a per-run description cap is the right
      # control to build if the single-IP description risk is ever measured.
      description_fetches_per_run: 40
      min_seconds_between_searches: 6.0
      jitter_seconds: [2.0, 6.0]
      fetch_descriptions: false
      desc_selection: none

  # Rotating proxy pool. Credentials come from the environment, never this file, since
  # config.yaml is committed:
  #
  #   SCRAPER_PROXIES="user:pass@gate.example.net:7000"          # one rotating endpoint
  #   SCRAPER_PROXIES="user:pass@a:7000,user:pass@b:7000"        # or an explicit list
  #
  # A rotating gateway usually hands out a fresh exit IP per request, which changes what a
  # 429 means: it flagged one exit IP, not the account. So when proxies are configured the
  # circuit retries on a new IP instead of tripping the source outright, and the LinkedIn
  # budget can be raised — the assumed ~10-page-per-IP wall was the reason it was forced
  # down otherwise, though a direct probe (2026-08-14, see the top of this file) found no
  # such wall through page 99 on a single proxied IP.
  proxies:
    enabled: true            # only takes effect when SCRAPER_PROXIES is set
    rotating: true           # the gateway rotates exit IPs per request
    # Budget overrides applied ONLY when proxies are actually available.
    with_proxies:
      linkedin:
        # max_pages_per_run was the binding constraint, not searches_per_run. At
        # results_wanted_default=50 and page_size=10 a cell costs 5 pages, so 36 pages
        # bought 7 cells a run and searches_per_run=12 was never reached. With 189
        # LinkedIn cells that is a ~13-day cycle at 2 runs/day, and the observed corpus
        # was far worse than that: 168 of 189 LinkedIn cells had never been scraped once.
        #
        # Raised on 2026-08-15 because LinkedIn earns the budget. Hit rate -- postings
        # reaching fit_score >= 60 -- measured over 5,831 verdicts:
        #
        #   linkedin   838 scored    99 hits   11.8%
        #   indeed   4,872 scored   212 hits    4.4%
        #
        # LinkedIn is 2.7x Indeed per posting and was getting a third of the page budget.
        # 90 pages is ~18 cells a run, a ~5-day cycle, and it stays far under the probe's
        # 99 consecutive pages on a SINGLE exit IP -- this pool has 100 rotating endpoints,
        # so per-IP load falls rather than rises. The circuit breaker still trips the
        # source outright on the first 429, so the downside is a backoff, not a ban.
        # Corrected 2026-08-15 from request_units=180/max_pages_per_run=90, which counted
        # search pages only. Measured, a census cell spends 56 requests: 6 search pages
        # plus one per posting. So 180 units never bound anything it was meant to bind,
        # and the run's real cost was ~1000 requests while the config said 90.
        #
        # These numbers preserve the 18 cells a run that was already happening -- the
        # traffic does not change, the accounting does. searches_per_run stays the binding
        # cap: 18 cells x 6 pages = 108, 18 x 56 = 1008.
        searches_per_run: 18
        request_units: 1010
        results_wanted_default: 50
        max_results_wanted: 75
        max_pages_per_run: 108
        min_seconds_between_searches: 2.0
        jitter_seconds: [0.5, 2.0]
        # The payoff of a proxy pool. One extra request per posting is unaffordable on a
        # single IP, so without proxies LinkedIn yields titles only and contributes to role
        # supply but not to skill demand. With rotating exits it becomes a full description
        # census, so LinkedIn feeds the skill analytics too.
        fetch_descriptions: true
        desc_selection: census

  circuit_breaker:
    consecutive_errors_to_trip: 3
    # Retries on a fresh exit IP before tripping, when a rotating pool is configured.
    proxy_rotation_retries: 3
    # A 429 means the IP is flagged. Retrying in-run deepens the flag, so it trips the
    # source outright instead -- deliberately unlike a polite API's retry-with-backoff.
    http_429_trips_immediately: true
    transient_retries: 2
    source_backoff_minutes: [15, 60, 240, 1440]
    cell_backoff_minutes: [60, 360, 1440]

  # Staffing firms and consultancies repost one requisition many times under varied
  # titles, which near-duplicate detection cannot catch because the descriptions genuinely
  # differ. Excluded from analytics by default; the dashboard offers a toggle.
  agencies:
    - Robert Half
    - Insight Global
    - TEKsystems
    - Motion Recruitment
    - CyberCoders
    - Jobot
    - Dice
    - Randstad
    - Adecco
    - Manpower
    - Hays
    - Michael Page
    - Academic Work
    - Nexer
    - Sopra Steria
    - Consid
    - Netcompany
    - Knightec
    - Sigma Technology
    - HiQ
    - Cygni

  # Static FX rates, used only to put salaries on one annual-USD axis. Precision is not
  # critical: salary_lift is a ratio computed within a stratum, and strata include country
  # so cross-currency figures never share a median.
  fx:
    USD: 1.00
    EUR: 1.08
    SEK: 0.095
    NOK: 0.093
    DKK: 0.145
    GBP: 1.27
    CAD: 0.73

# ---------------------------------------------------------------------------------------
# Matching
# ---------------------------------------------------------------------------------------
# What the keyword layer measures is requirement COVERAGE, not fit. It feeds the skill
# hint in the scoring prompt, the gap analytics, and a coarse tiebreak -- it does not rank
# the dashboard. See careerradar/search/keyword_score.py.
matching:
  weights:
    # Redistributed proportionally when BM25 was removed. Its query was a fixed bag of the
    # candidate's skill labels, identical for every posting, so it restated the coverage
    # component next to it with more noise and no validation.
    skill_coverage: 0.62
    title_family: 0.24
    seniority_fit: 0.14

# ---------------------------------------------------------------------------------------
# Analytics
# ---------------------------------------------------------------------------------------
analytics:
  windows: [30, 90]
  # Derived, not a preference: a full matrix cycle takes ~5 days, and comparing supply
  # across families needs several complete cycles or coverage is irreparably uneven.
  min_window_days: 30

  # Publication gates. Suppress WITH a reason; never silently omit.
  min_postings_for_skill: 20
  min_companies_for_skill: 3
  max_company_share: 0.40      # one employer dominating a skill is not market demand
  min_n_eff_for_scope: 20
  min_coverage_fraction: 0.50
  # Was 3, which conflicted with the scheduler's whole purpose: it deliberately ROTATES to
  # different cells rather than revisiting one, so a cell accumulates observations only
  # across days. Meanwhile coverage_fraction already measures what actually matters -- one
  # observation with hours_old=336 is a complete census of a 14-day window. Requiring 3 was
  # therefore redundant with the coverage gate and suppressed sound estimates. Observation
  # depth is still reported per row and shown in the coverage panel.
  min_observations_per_cell: 1
  min_salary_samples: 12

  exclude_agencies: true

  # Post-stratification target mix. Weights are DECLARED, not observed, so the estimate is
  # stable as the scrape rotation changes -- otherwise every metric wobbles with the
  # rotation and trend becomes meaningless.
  #   interest         -- "of the jobs I'd actually consider, X% require this"
  #   estimated_supply -- "of what the market is hiring for, X% require this"
  #   observed         -- diagnostic ONLY; reflects scrape rotation, not the market
  weighting_mode: interest
  reference_mix:
    ai_engineer|us_remote: 0.13
    ai_engineer|los_angeles: 0.07
    fullstack_engineer|us_remote: 0.11
    fullstack_engineer|los_angeles: 0.06
    platform_engineer|us_remote: 0.10
    platform_engineer|los_angeles: 0.05
    devops_engineer|us_remote: 0.07
    backend_engineer|us_remote: 0.06
    ai_engineer|helsinki: 0.05
    fullstack_engineer|helsinki: 0.04
    platform_engineer|helsinki: 0.04
    ai_engineer|stockholm: 0.05
    fullstack_engineer|stockholm: 0.04
    platform_engineer|stockholm: 0.04
    fullstack_engineer|oslo: 0.02
    fullstack_engineer|copenhagen: 0.02
    academic_technology|us_remote: 0.02
    tpm|us_remote: 0.02
    product_manager|us_remote: 0.01

  # Skill-gap composite. blocking_gap dominates deliberately: "this skill is what stands
  # between me and postings I otherwise match" is more actionable than raw popularity.
  gap_weights:
    blocking_gap: 0.40
    demand: 0.30
    adjacency: 0.20
    salary_lift: 0.10

# ---------------------------------------------------------------------------------------
# Digest
# ---------------------------------------------------------------------------------------
digest:
  enabled: true
  include_skill_gap: true

# ---------------------------------------------------------------------------------------
# Agents
#
# Three agents, three jobs, two models. Costs below are measured, not estimated -- see
# docs/deepseek.md for the token shape they come from.
# ---------------------------------------------------------------------------------------
profile:
  # Built once, interactively. Worth the larger model: this artifact decides how every
  # posting is scored thereafter, and it is a handful of calls, not thousands.
  model: deepseek-v4-pro
  max_interview_questions: 15

  # The documents the profile is built from. An explicit list, not a scan of resumes/.
  #
  # resumes/ also holds tailored resumes written for SUBMITTING to employers, which is a
  # different kind of document from evidence about what you can actually do. Scanning the
  # directory pulled six LLM-generated variants into the profile, and their inflated skill
  # lists became skill levels and then scores. Nothing errored; the numbers were wrong.
  #
  # Paths are relative to the repo root. A named file that is missing is an error, unless
  # marked `optional: true`.
  corpus:
    - path: achievements.md
      kind: achievements
    - path: resumes/resume.txt
      kind: resume

scoring:
  # The volume workhorse -- one call per posting. Flash with an automatically cached
  # profile prefix costs ~$0.0004 a posting, so scoring the whole corpus is a couple of
  # dollars rather than a reason to sample.
  model: deepseek-v4-flash
  concurrency: 16
  # Pre-flight: if the estimate exceeds this the run ABORTS rather than trimming the
  # queue. A budget that silently drops the tail produces a partial pass that looks
  # complete, and every coverage figure downstream inherits the lie.
  #
  # Raised from 2.50 with the v2 verdict schema: the model now returns a role summary and
  # five to eight quoted requirements with an assessment each, roughly doubling completion
  # length.
  #
  # Raised again to 8.00 on 2026-08-15, off the production backlog. The ceiling is a sanity
  # guard against a runaway queue, not a budget: at $0.0004 a posting it has to clear a
  # COLD backlog in one pass or the pre-flight aborts every single run and nothing is ever
  # scored. Production reached 11,598 unscored postings (~$4.64 estimated) while
  # careerradar-score.timer sat disabled, which is exactly the state that would have
  # deadlocked against the old $4.00 ceiling the moment the timer came back on.
  max_usd_per_run: 8.00
  # Which postings earn a deep-research pass. A predicate rather than a number on a lumpy
  # scale -- and it states its own reasoning, which `fit_score >= 70` never did.
  research_gate:
    eligibility: [eligible]
    role_match: [same_role, adjacent]
    capability_match: [exceeds, meets, most_with_gaps]

research:
  model: deepseek-v4-pro
  search_provider: tavily
  max_companies_per_run: 5
  # Dossiers age out rather than being rebuilt on every encounter; company facts move on
  # a scale of months, and a re-scrape of the same company is pure cost.
  refresh_days: 30
  max_usd_per_run: 2.00
