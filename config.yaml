# Find a Job defaults that are useful to customize. Application mechanics live in
# `findajob/core/config.py`; place personal overrides in `config.local.yaml`.

scraper:
  # Disable a board without removing its existing data.
  sources:
    indeed: true
    linkedin: true

  # Per-run limits. Keep these conservative unless you understand the board's limits.
  budgets:
    indeed:
      searches_per_run: 44
      request_units: 130
      results_wanted_default: 75
      max_results_wanted: 200
    linkedin:
      searches_per_run: 15
      results_wanted_default: 60
      max_results_wanted: 100
      max_pages_per_run: 60

  # Excluded from market analytics by default.
  agencies:
    - Robert Half
    - Insight Global
    - TEKsystems
    - Motion Recruitment
    - CyberCoders
    - Jobot
    - Dice
    - Randstad
    - Adecco
    - Manpower
    - Hays
    - Michael Page
    - Academic Work
    - Nexer
    - Sopra Steria
    - Consid
    - Netcompany
    - Knightec
    - Sigma Technology
    - HiQ
    - Cygni

  # Annual-salary conversion rates to USD. Add currencies used by your targets.
  fx:
    USD: 1.00
    EUR: 1.08
    SEK: 0.095
    NOK: 0.093
    DKK: 0.145
    GBP: 1.27
    CAD: 0.73

# Minimum evidence required before analytics publishes a result.
analytics:
  windows: [30, 90]
  min_window_days: 30
  min_postings_for_skill: 20
  min_companies_for_skill: 3
  max_company_share: 0.40
  min_postings_for_scope: 20
  min_coverage_fraction: 0.50
  min_observations_per_cell: 1
  min_salary_samples: 12
  exclude_agencies: true
  gap_weights:
    blocking_gap: 0.40
    demand: 0.30
    adjacency: 0.20
    salary_lift: 0.10

scoring:
  concurrency: 16
  fit_threshold: 70
  include_skill_hint: false
  max_usd_per_run: 8.00
  skip_seniority: [lead, staff]
  max_posting_age_days: 3

# Automatic runs remain off until explicitly enabled in config.local.yaml.
scheduler:
  enabled: false
