[project]
name = "careerradar"
version = "0.1.0"
description = "Agentic job search: scrapes job boards by role family and location, scores postings against an LLM-built profile, and researches the companies behind the good ones"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "python-jobspy",
    "langgraph>=1.2.11",
    "langchain-deepseek>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pypdf>=6.15.0",
    "langchain-tavily>=0.2.18",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
]

[project.scripts]
careerradar = "careerradar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["careerradar"]

[tool.uv.sources]
python-jobspy = { git = "https://github.com/speedyapply/JobSpy", rev = "fda080a373e8226f3fd60635323f5da9af9892b1" }

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
]

