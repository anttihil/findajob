[project]
name = "find-a-job"
version = "0.1.0"
description = "Agentic job search: scrapes job boards by query and location, scores postings against an LLM-built profile, and tailors a resume for the good ones"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "python-jobspy @ git+https://github.com/speedyapply/JobSpy.git@fda080a373e8226f3fd60635323f5da9af9892b1",
    "langgraph>=1.2.11",
    "langchain-deepseek>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pypdf>=6.15.0",
    "python-multipart>=0.0.32",
    "beautifulsoup4>=4.12.0",
    "typst>=0.15.0",
    "platformdirs>=4.0",
]

[project.scripts]
find-a-job = "careerradar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["careerradar"]
artifacts = ["careerradar/web/frontend/dist/**"]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RET",      # flake8-return
    "ARG",      # flake8-unused-arguments
    "PIE",      # flake8-pie
    "BLE",      # flake8-blind-except
    "G",        # flake8-logging-format
    "LOG",      # flake8-logging
    "ISC",      # flake8-implicit-str-concat
    "RUF",      # ruff-specific
]
ignore = [
    # Timestamps are written naive on purpose: they land in jobs.db columns and in
    # sync_status.json as bare isoformat strings, and making them tz-aware would append an
    # offset that every existing stored row and parser would have to be migrated for.
    "DTZ005", "DTZ007",
    # Prose in docstrings and user-facing strings uses en/em dashes and curly quotes.
    "RUF001", "RUF002", "RUF003",
    # f-strings in log calls are the established style across this codebase.
    "G004",
]

[tool.ruff.lint.per-file-ignores]
# Test doubles mirror real signatures, so they take arguments they deliberately never read.
# `tempfile.NamedTemporaryFile(delete=False)` + `.close()` is how these tests get a temp
# database path, so the handle is meant to outlive a `with` block.
"tests/*" = ["ARG001", "ARG002", "SIM115", "SIM117"]
# `Depends(...)` in a parameter default is the FastAPI dependency-injection idiom.
"careerradar/web/app.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["careerradar"]

[tool.pyright]
include = ["careerradar", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
