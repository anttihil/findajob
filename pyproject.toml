[project]
name = "job-search-automation"
version = "0.1.0"
description = "Gmail IMAP Job Search Automation and Digest Dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "python-jobspy",
]

[tool.uv]
package = false

[tool.uv.sources]
python-jobspy = { git = "https://github.com/speedyapply/JobSpy", rev = "fda080a373e8226f3fd60635323f5da9af9892b1" }

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
]

