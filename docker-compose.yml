services:
  find-a-job:
    build: .
    container_name: find-a-job
    ports:
      - "8010:8010"
    env_file:
      - .env
    volumes:
      - ./data/jobs.db:/app/data/jobs.db
      - ./graphs.db:/app/graphs.db
      - ./config.local.yaml:/app/config.local.yaml
      - ./resumes:/app/resumes
    restart: unless-stopped
