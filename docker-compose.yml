services:
  careerradar:
    build: .
    container_name: careerradar
    ports:
      - "8010:8010"
    env_file:
      - .env
    volumes:
      - ./jobs.db:/app/jobs.db
      - ./graphs.db:/app/graphs.db
      - ./config.local.yaml:/app/config.local.yaml
      - ./resumes:/app/resumes
    restart: unless-stopped
